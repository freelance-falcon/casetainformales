<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" role="img" aria-label="Los Informales">
  <defs>
    <g id="flor">
      <circle r="4.2" fill="#2f9ad6"/>
      <circle cx="0" cy="-6.2" r="2.5" fill="#2f9ad6"/>
      <circle cx="5.9" cy="-1.9" r="2.5" fill="#2f9ad6"/>
      <circle cx="3.6" cy="5" r="2.5" fill="#2f9ad6"/>
      <circle cx="-3.6" cy="5" r="2.5" fill="#2f9ad6"/>
      <circle cx="-5.9" cy="-1.9" r="2.5" fill="#2f9ad6"/>
    </g>
    <g id="florb">
      <circle r="3.2" fill="#7cc0e8"/>
      <circle cx="0" cy="-4.8" r="2" fill="#7cc0e8"/>
      <circle cx="4.6" cy="-1.5" r="2" fill="#7cc0e8"/>
      <circle cx="2.8" cy="3.9" r="2" fill="#7cc0e8"/>
      <circle cx="-2.8" cy="3.9" r="2" fill="#7cc0e8"/>
      <circle cx="-4.6" cy="-1.5" r="2" fill="#7cc0e8"/>
    </g>
    <g id="bola">
      <circle r="4.6" fill="#3ba4dc"/>
      <circle r="4.6" fill="none" stroke="#2b86bd" stroke-width="0.8"/>
      <circle cx="-1.3" cy="-1.3" r="1.5" fill="#8fd0f2"/>
    </g>
    <ellipse id="hoja" rx="6.5" ry="2.4" fill="#5cb84e"/>
    <g id="balon">
      <circle r="19" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.4"/>
      <polygon points="0,-7.8 7.4,-2.4 4.6,6.3 -4.6,6.3 -7.4,-2.4" fill="#1c1c1c"/>
      <path d="M0,-7.8 L0,-19 M7.4,-2.4 L18,-5.9 M4.6,6.3 L11.2,15.4 M-4.6,6.3 L-11.2,15.4 M-7.4,-2.4 L-18,-5.9" stroke="#1c1c1c" stroke-width="1.7" fill="none"/>
    </g>
    <g id="margarita">
      <circle r="3" fill="#f2b23c"/>
      <g fill="#ffffff">
        <ellipse cx="0" cy="-6" rx="2.6" ry="3.8"/>
        <ellipse cx="5.6" cy="-2" rx="2.6" ry="3.8" transform="rotate(70 5.6 -2)"/>
        <ellipse cx="3.5" cy="5" rx="2.6" ry="3.8" transform="rotate(140 3.5 5)"/>
        <ellipse cx="-3.5" cy="5" rx="2.6" ry="3.8" transform="rotate(-140 -3.5 5)"/>
        <ellipse cx="-5.6" cy="-2" rx="2.6" ry="3.8" transform="rotate(-70 -5.6 -2)"/>
      </g>
    </g>
  </defs>

  <rect width="1300" height="360" fill="#f5f8fa"/>

  <!-- ================= confeti ================= -->
  <g>
    <!-- campo izquierdo -->
    <use href="#flor" x="34" y="150"/><use href="#flor" x="76" y="96"/><use href="#flor" x="60" y="215"/>
    <use href="#flor" x="118" y="132"/><use href="#flor" x="96" y="180"/><use href="#flor" x="150" y="88"/>
    <use href="#flor" x="168" y="168"/><use href="#flor" x="140" y="235"/><use href="#flor" x="205" y="120"/>
    <use href="#flor" x="228" y="200"/><use href="#flor" x="262" y="92"/><use href="#flor" x="250" y="156"/>
    <use href="#flor" x="298" y="128"/><use href="#flor" x="300" y="212"/><use href="#flor" x="342" y="86"/>
    <use href="#flor" x="352" y="172"/><use href="#flor" x="392" y="132"/><use href="#flor" x="382" y="228"/>
    <use href="#bola" x="52" y="118"/><use href="#bola" x="96" y="152"/><use href="#bola" x="130" y="102"/>
    <use href="#bola" x="122" y="205"/><use href="#bola" x="186" y="142"/><use href="#bola" x="178" y="92"/>
    <use href="#bola" x="222" y="170"/><use href="#bola" x="276" y="122"/><use href="#bola" x="268" y="190"/>
    <use href="#bola" x="322" y="100"/><use href="#bola" x="330" y="156"/><use href="#bola" x="372" y="200"/>
    <use href="#hoja" x="66" y="132" transform="rotate(-30 66 132)"/>
    <use href="#hoja" x="142" y="118" transform="rotate(20 142 118)"/>
    <use href="#hoja" x="112" y="165" transform="rotate(-15 112 165)"/>
    <use href="#hoja" x="200" y="185" transform="rotate(35 200 185)"/>
    <use href="#hoja" x="240" y="108" transform="rotate(-25 240 108)"/>
    <use href="#hoja" x="312" y="182" transform="rotate(15 312 182)"/>
    <use href="#hoja" x="366" y="110" transform="rotate(-20 366 110)"/>

    <!-- campo derecho -->
    <use href="#flor" x="1266" y="150"/><use href="#flor" x="1224" y="96"/><use href="#flor" x="1240" y="215"/>
    <use href="#flor" x="1182" y="132"/><use href="#flor" x="1204" y="180"/><use href="#flor" x="1150" y="88"/>
    <use href="#flor" x="1132" y="168"/><use href="#flor" x="1160" y="235"/><use href="#flor" x="1095" y="120"/>
    <use href="#flor" x="1072" y="200"/><use href="#flor" x="1038" y="92"/><use href="#flor" x="1050" y="156"/>
    <use href="#flor" x="1002" y="128"/><use href="#flor" x="1000" y="212"/><use href="#flor" x="958" y="86"/>
    <use href="#flor" x="948" y="172"/><use href="#flor" x="908" y="132"/><use href="#flor" x="918" y="228"/>
    <use href="#bola" x="1248" y="118"/><use href="#bola" x="1204" y="152"/><use href="#bola" x="1170" y="102"/>
    <use href="#bola" x="1178" y="205"/><use href="#bola" x="1114" y="142"/><use href="#bola" x="1122" y="92"/>
    <use href="#bola" x="1078" y="170"/><use href="#bola" x="1024" y="122"/><use href="#bola" x="1032" y="190"/>
    <use href="#bola" x="978" y="100"/><use href="#bola" x="970" y="156"/><use href="#bola" x="928" y="200"/>
    <use href="#hoja" x="1234" y="132" transform="rotate(30 1234 132)"/>
    <use href="#hoja" x="1158" y="118" transform="rotate(-20 1158 118)"/>
    <use href="#hoja" x="1188" y="165" transform="rotate(15 1188 165)"/>
    <use href="#hoja" x="1100" y="185" transform="rotate(-35 1100 185)"/>
    <use href="#hoja" x="1060" y="108" transform="rotate(25 1060 108)"/>
    <use href="#hoja" x="988" y="182" transform="rotate(-15 988 182)"/>
    <use href="#hoja" x="934" y="110" transform="rotate(20 934 110)"/>

    <!-- centro, escaso -->
    <use href="#flor" x="480" y="58"/><use href="#bola" x="836" y="52"/>
    <use href="#hoja" x="532" y="44" transform="rotate(15 532 44)"/>
    <use href="#hoja" x="788" y="40" transform="rotate(-15 788 40)"/>
    <use href="#bola" x="452" y="96"/><use href="#flor" x="862" y="96"/>
  </g>

  <!-- ================= título: balones dentro de las "o" ================= -->
  <g fill="#3fa9dd" font-family="'Titan One','Arial Rounded MT Bold',Arial,sans-serif" font-size="78">
    <text x="400" y="112" textLength="44" lengthAdjust="spacingAndGlyphs">L</text>
    <text x="490" y="112" textLength="38" lengthAdjust="spacingAndGlyphs">s</text>
    <text x="548" y="112" textLength="96" lengthAdjust="spacingAndGlyphs">Inf</text>
    <text x="688" y="112" textLength="212" lengthAdjust="spacingAndGlyphs">rmales</text>
  </g>
  <use href="#balon" x="466" y="86"/>
  <use href="#balon" x="666" y="86"/>

  <!-- ================= franja azul base ================= -->
  <rect y="300" width="1300" height="60" fill="#7cc0e8"/>

  <!-- ================= skyline ================= -->
  <g fill="#7cc0e8">
    <!-- paellera / bombo a la izquierda -->
    <path d="M-20 300 A58 58 0 0 1 96 300 Z"/>
    <rect x="-20" y="238" width="120" height="7" rx="3.5"/>

    <!-- carpas de arcos -->
    <path d="M120 300 V262
             C128 232 145 224 153 224 C161 224 178 232 186 262
             C194 232 211 224 219 224 C227 224 244 232 252 262
             C260 232 277 224 285 224 C293 224 310 232 318 262
             C326 232 343 224 351 224 C359 224 376 232 384 262
             C392 232 409 224 417 224 C425 224 442 232 450 262
             V300 Z"/>
    <rect x="142" y="270" width="22" height="12" fill="#f5f8fa"/>
    <rect x="208" y="270" width="22" height="12" fill="#f5f8fa"/>
    <rect x="274" y="270" width="22" height="12" fill="#f5f8fa"/>
    <rect x="340" y="270" width="22" height="12" fill="#f5f8fa"/>
    <rect x="406" y="270" width="22" height="12" fill="#f5f8fa"/>
    <use href="#florb" x="176" y="252"/><use href="#florb" x="308" y="248"/><use href="#florb" x="424" y="254"/>

    <!-- rampa -->
    <path d="M450 300 L588 274 L588 300 Z"/>

    <!-- alcazaba (esbelta, entre flamenca y flamenco) -->
    <path d="M648 300 V180 h13 v-14 h12 v14 h14 v-14 h12 v14 h14 v-14 h12 v14 h13 V300 Z"/>
    <rect x="748" y="252" width="56" height="48"/>

    <!-- Virgen con corona -->
    <g>
      <path d="M812 300 L840 196 L868 300 Z"/>
      <path d="M820 192 L826 164 L833 180 L840 156 L847 180 L854 164 L860 192 Q840 202 820 192 Z"/>
    </g>

    <!-- iglesia -->
    <path d="M894 300 V198 h44 V300 Z"/>
    <polygon points="890,198 942,198 916,170"/>
    <rect x="903" y="210" width="9" height="17" rx="4.5" fill="#f5f8fa"/>
    <rect x="919" y="210" width="9" height="17" rx="4.5" fill="#f5f8fa"/>
    <rect x="944" y="244" width="106" height="56"/>
    <rect x="938" y="236" width="118" height="8" rx="3"/>

    <!-- bailaora silueta -->
    <path transform="translate(-16,0)" d="M1076 300 q0 -34 13 -56 l-2 -10 q0 -10 10 -12 q1 -12 12 -12 q11 0 12 12 q10 2 10 12 q0 4 -2 7 q10 -2 17 -10 q6 -7 11 -1 q4 6 -2 12 q-11 12 -25 13 q9 21 13 45 Z"/>

    <!-- toro (de pie, mirando a la izquierda) -->
    <g>
      <path d="M1120 230 q-17 -5 -20 -21 q14 -3 24 11 Z"/>
      <path d="M1140 222 q-1 -19 11 -24 q7 10 0 25 Z"/>
      <ellipse cx="1134" cy="248" rx="23" ry="19"/>
      <rect x="1140" y="222" width="132" height="50" rx="25"/>
      <rect x="1150" y="264" width="10" height="36" rx="4"/>
      <rect x="1174" y="266" width="10" height="34" rx="4"/>
      <rect x="1240" y="264" width="10" height="36" rx="4"/>
      <rect x="1260" y="266" width="10" height="34" rx="4"/>
      <path d="M1268 238 q16 10 10 30 q-4 12 -13 12 q7 -18 3 -42 Z"/>
    </g>
  </g>

  <!-- ================= flamenca ================= -->
  <g transform="translate(498,118)">
    <!-- abanico azul -->
    <g transform="translate(90,-26) rotate(-6)">
      <path d="M0 10 L-32 -24 A42 42 0 0 1 34 -22 Z" fill="#3fa9dd"/>
      <path d="M0 10 L-22 -28 M0 10 L-2 -32 M0 10 L20 -28" stroke="#f5f8fa" stroke-width="2.4"/>
      <circle cx="0" cy="10" r="3.5" fill="#2b86bd"/>
    </g>
    <!-- brazo derecho alzado -->
    <path d="M60 36 q16 -26 26 -52" stroke="#f0c9a8" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <!-- brazo izquierdo hacia atrás -->
    <path d="M44 38 q-20 10 -24 34" stroke="#f0c9a8" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <!-- cuerpo (talle) -->
    <path d="M42 24 q10 -6 22 0 q6 22 4 42 q-16 8 -30 0 q0 -20 4 -42 Z" fill="#3fa9dd"/>
    <!-- falda: campana azul -->
    <path d="M38 62 q14 8 30 0 q10 34 26 62 q14 26 30 56 h-138 q16 -30 28 -56 q14 -28 24 -62 Z" fill="#3fa9dd"/>
    <!-- volante blanco ancho -->
    <path d="M12 128 q22 -12 40 0 q20 12 42 0 q10 -6 18 2 q6 14 11 26 q-24 14 -46 2 q-22 -12 -46 2 q-22 12 -44 -2 q5 -12 11 -26 q7 -7 14 -4 Z" fill="#ffffff"/>
    <!-- volante azul inferior -->
    <path d="M-6 168 q26 -14 48 0 q22 14 48 0 q14 -8 24 2 q4 8 8 10 h-138 q3 -4 10 -12 Z" fill="#3fa9dd"/>
    <!-- filo blanco del bajo -->
    <path d="M-14 180 h138 v4 q-36 10 -70 0 q-34 -10 -68 2 Z" fill="#ffffff" opacity="0.9"/>
    <!-- cabeza -->
    <circle cx="54" cy="10" r="15" fill="#f0c9a8"/>
    <!-- pelo recogido con moño -->
    <path d="M39 9 A15 15 0 0 1 69 7 q2 6 -4 8 q-11 -9 -23 -1 q-4 -2 -3 -5 Z" fill="#2b2320"/>
    <circle cx="37" cy="0" r="7" fill="#2b2320"/>
    <!-- peineta azul -->
    <use href="#florb" x="58" y="-9"/>
    <!-- pendiente -->
    <circle cx="42" cy="17" r="2" fill="#f2699c"/>
  </g>

  <!-- ================= flamenco con guitarra ================= -->
  <g transform="translate(688,146)">
    <!-- patas naranjas: una recta, otra doblada -->
    <path d="M46 104 V154 M62 104 Q72 122 64 154" stroke="#d98a2b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M40 154 h13 M58 154 h13" stroke="#d98a2b" stroke-width="4" stroke-linecap="round"/>
    <!-- cola -->
    <path d="M6 66 q-12 -6 -16 -18 q10 0 18 6 q-4 -12 2 -20 q8 6 10 18 Z" fill="#ee7fa8"/>
    <!-- cuerpo -->
    <ellipse cx="46" cy="72" rx="42" ry="35" fill="#f286ad"/>
    <!-- cuello en S hacia la cabeza -->
    <path d="M78 52 C98 42 104 34 100 16" stroke="#f286ad" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- cabeza -->
    <circle cx="100" cy="12" r="13" fill="#f286ad"/>
    <circle cx="106" cy="4" r="4.5" fill="#f5f8fa"/>
    <circle cx="98" cy="6" r="2.6" fill="#26211f"/>
    <!-- pico tucán: fino, cresta oscura y cuerpo albero -->
    <path d="M111 6 C134 2 152 8 156 17 C157 21 152 23 145 22 C129 21 116 15 110 11 Z" fill="#f2b23c"/>
    <path d="M111 6 C130 2 146 5 154 12 C146 9 132 8 112 9 Z" fill="#2f3340"/>
    <path d="M114 15 C128 20 140 22 150 21 C144 25 128 25 115 19 Z" fill="#d8952c"/>
    <!-- guitarra azul delante del cuerpo -->
    <g transform="translate(40,66) rotate(16)">
      <rect x="-3.5" y="-62" width="7" height="44" rx="3" fill="#1f6f9f"/>
      <rect x="-7" y="-70" width="14" height="10" rx="3" fill="#1f6f9f"/>
      <path d="M0 -18 q-17 0 -17 16 q0 9 8 13 q-11 6 -8 19 q4 16 17 16 q13 0 17 -16 q3 -13 -8 -19 q8 -4 8 -13 q0 -16 -17 -16 Z" fill="#2f9ad6"/>
      <circle cx="0" cy="4" r="7" fill="#f5f8fa"/>
      <circle cx="0" cy="4" r="7" fill="none" stroke="#1f6f9f" stroke-width="1.6"/>
      <rect x="-8" y="24" width="16" height="4" rx="2" fill="#1f6f9f"/>
      <path d="M-2 -60 v82 M2 -60 v82" stroke="#cfeafa" stroke-width="0.9"/>
    </g>
    <!-- ala sobre la guitarra -->
    <path d="M30 62 q18 -10 34 4 q-4 18 -24 16 q-16 -2 -10 -20 Z" fill="#e86a9a"/>
    <!-- flores blancas y azules al cuello -->
    <use href="#margarita" x="76" y="42"/>
    <use href="#margarita" x="62" y="52"/>
    <use href="#florb" x="88" y="52"/>
    <use href="#flor" x="70" y="64"/>
  </g>
</svg>
