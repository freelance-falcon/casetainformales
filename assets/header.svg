<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" role="img" aria-label="Los Informales">
  <defs>
    <g id="flor">
      <circle r="4.5" fill="#2f9ad6"/>
      <circle cx="0" cy="-6.5" r="2.6" fill="#2f9ad6"/>
      <circle cx="6.2" cy="-2" r="2.6" fill="#2f9ad6"/>
      <circle cx="3.8" cy="5.3" r="2.6" fill="#2f9ad6"/>
      <circle cx="-3.8" cy="5.3" r="2.6" fill="#2f9ad6"/>
      <circle cx="-6.2" cy="-2" r="2.6" fill="#2f9ad6"/>
    </g>
    <g id="bola">
      <circle r="5" fill="#3ba4dc"/>
      <circle r="5" fill="none" stroke="#2b86bd" stroke-width="0.8"/>
      <circle cx="-1.4" cy="-1.4" r="1.6" fill="#8fd0f2"/>
    </g>
    <ellipse id="hoja" rx="7" ry="2.6" fill="#5cb84e"/>
    <g id="balon">
      <circle r="16" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
      <polygon points="0,-6.6 6.3,-2 3.9,5.4 -3.9,5.4 -6.3,-2" fill="#1c1c1c"/>
      <path d="M0,-6.6 L0,-16 M6.3,-2 L15.2,-4.9 M3.9,5.4 L9.4,12.9 M-3.9,5.4 L-9.4,12.9 M-6.3,-2 L-15.2,-4.9" stroke="#1c1c1c" stroke-width="1.5" fill="none"/>
    </g>
  </defs>

  <rect width="1300" height="360" fill="#f5f8fa"/>

  <!-- confeti: flores, bolas, hojas -->
  <g opacity="0.95">
    <use href="#flor" x="60" y="120"/><use href="#flor" x="150" y="70"/><use href="#flor" x="110" y="190"/>
    <use href="#flor" x="230" y="140"/><use href="#flor" x="300" y="80"/><use href="#flor" x="350" y="180"/>
    <use href="#flor" x="45" y="250"/><use href="#flor" x="200" y="235"/><use href="#flor" x="395" y="120"/>
    <use href="#bola" x="95" y="85"/><use href="#bola" x="180" y="160"/><use href="#bola" x="265" y="55"/>
    <use href="#bola" x="330" y="230"/><use href="#bola" x="70" y="185"/><use href="#bola" x="415" y="210"/>
    <use href="#hoja" x="130" y="130" transform="rotate(-25 130 130)"/>
    <use href="#hoja" x="250" y="195" transform="rotate(20 250 195)"/>
    <use href="#hoja" x="360" y="60" transform="rotate(-10 360 60)"/>
    <use href="#hoja" x="90" y="290" transform="rotate(30 90 290)"/>

    <use href="#flor" x="1240" y="120"/><use href="#flor" x="1150" y="70"/><use href="#flor" x="1190" y="190"/>
    <use href="#flor" x="1070" y="140"/><use href="#flor" x="1000" y="80"/><use href="#flor" x="950" y="180"/>
    <use href="#flor" x="1255" y="250"/><use href="#flor" x="1100" y="235"/><use href="#flor" x="905" y="120"/>
    <use href="#bola" x="1205" y="85"/><use href="#bola" x="1120" y="160"/><use href="#bola" x="1035" y="55"/>
    <use href="#bola" x="970" y="230"/><use href="#bola" x="1230" y="185"/><use href="#bola" x="885" y="210"/>
    <use href="#hoja" x="1170" y="130" transform="rotate(25 1170 130)"/>
    <use href="#hoja" x="1050" y="195" transform="rotate(-20 1050 195)"/>
    <use href="#hoja" x="940" y="60" transform="rotate(10 940 60)"/>
    <use href="#hoja" x="1210" y="290" transform="rotate(-30 1210 290)"/>

    <use href="#flor" x="480" y="55"/><use href="#bola" x="820" y="50"/>
    <use href="#hoja" x="530" y="90" transform="rotate(15 530 90)"/>
    <use href="#hoja" x="770" y="85" transform="rotate(-15 770 85)"/>
  </g>

  <!-- título flanqueado por balones -->
  <use href="#balon" x="318" y="50"/>
  <text x="650" y="72" text-anchor="middle"
        font-family="'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif"
        font-size="72" font-weight="800" fill="#2f9ad6"
        letter-spacing="1">Los Informales</text>
  <use href="#balon" x="982" y="50"/>

  <!-- franja azul base -->
  <rect y="300" width="1300" height="60" fill="#7cc0e8"/>

  <!-- skyline -->
  <g fill="#7cc0e8">
    <!-- noria -->
    <g stroke="#7cc0e8" stroke-width="7" fill="none">
      <circle cx="40" cy="240" r="44"/>
      <path d="M40 196 V284 M-4 240 H84 M9 209 L71 271 M9 271 L71 209"/>
    </g>
    <path d="M12 300 L40 240 L68 300 Z"/>
    <!-- carpas -->
    <path d="M100 300 v-55 q22 -16 44 0 q22 -16 44 0 q22 -16 44 0 q22 -16 44 0 q22 -16 44 0 q22 -16 44 0 v55 Z"/>
    <rect x="120" y="262" width="26" height="14" fill="#f5f8fa"/>
    <rect x="186" y="262" width="26" height="14" fill="#f5f8fa"/>
    <rect x="252" y="262" width="26" height="14" fill="#f5f8fa"/>
    <rect x="318" y="262" width="26" height="14" fill="#f5f8fa"/>
    <!-- rampa hacia el centro -->
    <path d="M364 300 L540 272 L540 300 Z"/>
    <!-- alcazaba -->
    <path d="M600 300 V172 h14 v-14 h13 v14 h15 v-14 h13 v14 h15 v-14 h13 v14 h14 V300 Z"/>
    <rect x="585" y="230" width="130" height="70"/>
    <!-- iglesia -->
    <path d="M880 300 V196 h20 v-26 h7 v-14 h8 v14 h7 v26 h20 V300 Z"/>
    <rect x="864" y="240" width="180" height="60"/>
    <rect x="944" y="222" width="70" height="78"/>
    <!-- bailaora silueta -->
    <path d="M1075 300 q4 -34 16 -58 q-10 -6 -8 -18 q2 -12 14 -14 q4 -16 16 -14 q10 2 10 14 l16 -22 q6 -6 10 0 q4 6 -2 12 l-16 24 q10 26 16 76 Z"/>
    <!-- toro (silueta tipo Osborne, mirando a la izquierda) -->
    <g>
      <rect x="1162" y="258" width="10" height="42" rx="4"/>
      <rect x="1182" y="262" width="10" height="38" rx="4"/>
      <rect x="1244" y="258" width="10" height="42" rx="4"/>
      <rect x="1262" y="262" width="10" height="38" rx="4"/>
      <rect x="1152" y="228" width="128" height="48" rx="22"/>
      <circle cx="1154" cy="242" r="19"/>
      <path d="M1146 226 q-16 -4 -20 -18 q12 -4 24 8 Z"/>
      <path d="M1162 222 q-2 -16 8 -24 q8 8 4 24 Z"/>
      <path d="M1278 234 q14 6 10 22 q-4 12 -14 12 q6 -16 4 -34 Z"/>
    </g>
  </g>

  <!-- flamenca central -->
  <g transform="translate(482,96)">
    <!-- abanico en mano derecha alzada -->
    <g transform="translate(94,-30)">
      <path d="M0 6 L-24 -26 A38 38 0 0 1 26 -22 Z" fill="#4aa8de"/>
      <path d="M0 6 L-16 -30 M0 6 L2 -32 M0 6 L18 -28" stroke="#f5f8fa" stroke-width="2.4"/>
    </g>
    <!-- brazo derecho alzado hacia el abanico -->
    <path d="M64 34 q18 -28 28 -58" stroke="#f0c9a8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- brazo izquierdo en jarra -->
    <path d="M48 36 q-20 12 -16 40" stroke="#f0c9a8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- cuerpo / vestido -->
    <path d="M54 26 q-20 40 -30 92 q-8 42 -32 86 h132 q-18 -46 -26 -88 q-8 -48 -12 -90 Z" fill="#4aa8de"/>
    <!-- volantes -->
    <path d="M8 168 q32 -14 52 0 q26 14 52 0 q4 10 7 20 q-32 16 -58 0 q-26 -14 -60 2 q4 -12 7 -22 Z" fill="#ffffff"/>
    <path d="M-4 204 q36 -16 60 0 q28 16 62 -2 q4 10 6 18 h-134 q3 -8 6 -16 Z" fill="#4aa8de"/>
    <!-- cabeza -->
    <circle cx="58" cy="10" r="15" fill="#f0c9a8"/>
    <path d="M44 2 q14 -16 30 -2 q4 8 -2 10 q-12 -8 -24 0 q-6 -2 -4 -8 Z" fill="#332621"/>
    <circle cx="72" cy="-4" r="4" fill="#4aa8de"/>
    <circle cx="46" cy="16" r="2.2" fill="#f48fb6"/>
  </g>

  <!-- flamenco rosa con guitarra -->
  <g transform="translate(668,120)">
    <!-- patas -->
    <path d="M52 128 v46 M66 128 v46" stroke="#e8a03e" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 174 h12 M60 174 h12" stroke="#e8a03e" stroke-width="4" stroke-linecap="round"/>
    <!-- cuerpo -->
    <path d="M28 96 q-16 -30 8 -48 q20 -14 44 -2 q6 -34 36 -32 q4 2 2 6 q-18 8 -16 30 q22 16 16 44 q-8 32 -44 34 q-34 2 -46 -32 Z" fill="#f48fb6"/>
    <!-- cuello hacia la cabeza -->
    <path d="M96 22 q10 -8 20 -4" stroke="#f48fb6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- cabeza -->
    <circle cx="118" cy="16" r="14" fill="#f48fb6"/>
    <circle cx="122" cy="10" r="3" fill="#26211f"/>
    <!-- pico tucán curvado -->
    <path d="M130 8 q36 -8 44 10 q2 10 -10 12 q-20 2 -30 -8 q-6 -6 -4 -14 Z" fill="#f2b23c"/>
    <path d="M132 20 q20 8 34 4 q-16 10 -34 2 Z" fill="#d8952c"/>
    <!-- flores cuello -->
    <use href="#flor" x="100" y="38"/><use href="#flor" x="86" y="50"/>
    <circle cx="96" cy="46" r="4" fill="#ffffff"/>
    <!-- guitarra en diagonal delante del cuerpo -->
    <g transform="translate(58,86) rotate(-35)">
      <rect x="-3.5" y="-58" width="7" height="40" rx="3" fill="#2b86bd"/>
      <rect x="-6.5" y="-66" width="13" height="10" rx="3" fill="#2b86bd"/>
      <ellipse cx="0" cy="8" rx="19" ry="26" fill="#3ba4dc"/>
      <circle cx="0" cy="0" r="8" fill="#f5f8fa"/>
      <path d="M-1.5 -56 v58 M1.5 -56 v58" stroke="#cfeafa" stroke-width="1"/>
    </g>
    <!-- ala sobre la guitarra -->
    <path d="M36 74 q16 -8 30 4 q-4 16 -20 14 q-14 -2 -10 -18 Z" fill="#ef6fa3"/>
  </g>
</svg>
